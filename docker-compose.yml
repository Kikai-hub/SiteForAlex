name: adana-pizza

services:
  postgres:
    image: postgres:17-alpine
    # Default max_connections (100) is too tight once `web` runs as several
    # PM2 workers, each with its own pool (see lib/prisma.ts) — 200 leaves
    # headroom above the 150-connection budget that math divides up.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adana}
      POSTGRES_DB: ${POSTGRES_DB:-adana_pizza}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adana} -d ${POSTGRES_DB:-adana_pizza}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Shared Next.js data-cache store (see cache-handler.js) and rate-limit
  # counters (see lib/rateLimit.ts) — both need a store every `web` PM2
  # worker sees the same view of, which process memory can't provide.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: applies pending Prisma migrations, then (only on a brand new,
  # empty database) loads the starter menu — see prisma/seed-initial-menu.ts.
  # `web` waits for this to finish successfully before it starts, so the app
  # never boots against a schema it doesn't match or an empty menu.
  migrate:
    build:
      context: .
      target: builder
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-adana}:${POSTGRES_PASSWORD:-adana}@postgres:5432/${POSTGRES_DB:-adana_pizza}
      NODE_ENV: production
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed-initial-menu.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
    restart: "no"

  web:
    build:
      context: .
      target: runner
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-adana}:${POSTGRES_PASSWORD:-adana}@postgres:5432/${POSTGRES_DB:-adana_pizza}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      # Caddy is the only way in (see below) and is exactly one hop away, and
      # it always overwrites X-Forwarded-For itself (see Caddyfile) — so the
      # value reaching the app here can be trusted for rate-limit decisions.
      TRUSTED_PROXY_HOPS: "1"
      # Uncomment to pin a specific PM2 worker count (see ecosystem.config.js)
      # instead of one per CPU core — lib/prisma.ts divides its connection
      # budget by whatever this resolves to, so pool sizing follows automatically.
      # WEB_CONCURRENCY: "4"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
    expose:
      - "3000"
    # Deliberately NOT publishing a host port here — Caddy is the only public
    # entry point (see below) so X-Forwarded-For can't be forged by talking
    # to this container directly, which would otherwise defeat the app's
    # login brute-force rate limiting.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # Reverse proxy + TLS termination — the only container exposed to the
  # internet. Works immediately with no domain (plain HTTP on :80); set
  # SITE_DOMAIN in .env once DNS points here and Caddy auto-provisions
  # Let's Encrypt HTTPS on restart.
  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:
